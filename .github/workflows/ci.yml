# Integración continua: tipos, lint, formato, tests, auditoría de dependencias de ejecución y empaquetado
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Solo dependencias de ejecución; falla con severidad alta o crítica
      - run: npm audit --omit=dev --audit-level=high
      # El empaquetado de la librería solo se ejecuta en CI
      - run: npm run package
